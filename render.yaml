services:
  - type: web
    name: settle-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: python -m backend.api.server
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: NODE_VERSION
        value: 20.18.0
      - key: SETTLE_DB
        value: /tmp/settle.db
      - key: SETTLE_TOKEN_SECRET
        generateValue: true
      - key: SETTLE_PAYPAL_CLIENT_ID
        sync: false
      - key: SETTLE_PAYPAL_CLIENT_SECRET
        sync: false
      - key: SETTLE_ANTHROPIC_API_KEY
        sync: false
  - type: web
    name: settle-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: settle-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

